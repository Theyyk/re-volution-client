name: Build RE:volution Client

on:
  push:
    branches: [ main, 'feature/**', 'release/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.changes.outputs.auth }}
      signing: ${{ steps.changes.outputs.signing }}
      mod: ${{ steps.changes.outputs.mod }}
      launcher: ${{ steps.changes.outputs.launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate all workflows with actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck= -pyflakes=
      - name: Test change detection policy
        run: python3 .github/ci/test_changes.py
      - name: Test DEV selection and late-old-run watermark
        run: python3 scripts/test-dev-channel.py
      - name: Select affected components (manual/tag/unknown diff runs all)
        id: changes
        run: python3 .github/ci/changes.py

  auth-backend:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages (restore still validates project inputs)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-dotnet10-client-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/global.json', '**/[Nn]u[Gg]et.[Cc]onfig', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-dotnet10-client-${{ github.job }}-
      - name: Build Auth API
        run: dotnet build auth/REvolutionClient.Auth.csproj -c Release
      - name: Check local accepted DEV channel and default PROD isolation
        run: python3 scripts/test-dev-auth.py --dll auth/bin/Prod/Release/net10.0/REvolutionClient.Auth.dll
      - name: Smoke test Auth API
        shell: bash
        run: |
          set -euo pipefail
          export REVOLUTION_AUTH_DB="$RUNNER_TEMP/revolution-auth-ci.db"
          dotnet run --project auth/REvolutionClient.Auth.csproj -c Release --no-build > "$RUNNER_TEMP/revolution-auth.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:25567/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat "$RUNNER_TEMP/revolution-auth.log"
            exit 1
          fi

          register_code=$(curl --silent --show-error -o "$RUNNER_TEMP/register.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"CiUser","password":"CiPassword123!"}' \
            http://127.0.0.1:25567/api/v1/auth/register)
          test "$register_code" = "200"

          login_code=$(curl --silent --show-error -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciuser","password":"CiPassword123!"}' \
            http://127.0.0.1:25567/api/v1/auth/login)
          test "$login_code" = "200"

          duplicate_code=$(curl --silent --show-error -o "$RUNNER_TEMP/duplicate.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"CIUSER","password":"AnotherPassword123!"}' \
            http://127.0.0.1:25567/api/v1/auth/register)
          test "$duplicate_code" = "409"

  manifest-signing:
    needs: changes
    if: needs.changes.outputs.signing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build manifest signer
        run: dotnet build tools/ManifestSigner/ManifestSigner.csproj -c Release
      - name: Smoke test manifest signing
        shell: bash
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/manifest.private.pem"
          public_key="$RUNNER_TEMP/manifest.public.pem"
          envelope="$RUNNER_TEMP/manifest.signed.json"
          dotnet run --project tools/ManifestSigner/ManifestSigner.csproj -c Release --no-build -- generate \
            --private "$private_key" \
            --public "$public_key"
          dotnet run --project tools/ManifestSigner/ManifestSigner.csproj -c Release --no-build -- sign \
            --manifest manifest/bootstrap.dev.json \
            --private "$private_key" \
            --key-id ci-test-key \
            --output "$envelope"
          dotnet run --project tools/ManifestSigner/ManifestSigner.csproj -c Release --no-build -- verify \
            --envelope "$envelope" \
            --public "$public_key" \
            --key-id ci-test-key

  client-mod:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build client-only Forge mod
        run: gradle -p mod -Dnet.minecraftforge.gradle.check.certs=false clean build --no-daemon --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: RE-volution-Client-Mod
          path: mod/build/libs/RE-volution-Client-Mod-*.jar
          if-no-files-found: error
          retention-days: 3

  launcher:
    needs: [changes, client-mod]
    if: needs.changes.outputs.launcher == 'true'
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages (restore still validates project inputs)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-dotnet10-client-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/global.json', '**/[Nn]u[Gg]et.[Cc]onfig', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-dotnet10-client-${{ github.job }}-
      - name: Download client mod payload
        uses: actions/download-artifact@v4
        with:
          name: RE-volution-Client-Mod
          path: launcher/Payload
      - name: Download gameplay mod from production signed manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path launcher/Payload | Out-Null

          $manifestUrl = 'https://raw.githubusercontent.com/Theyyk/re-volution-client/main/manifest/manifest.production.signed.json'
          $envelopePath = Join-Path $env:RUNNER_TEMP 'manifest.production.signed.json'
          Invoke-WebRequest -Uri $manifestUrl -OutFile $envelopePath

          $envelope = Get-Content -Raw $envelopePath | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($envelope.payload)) { throw 'Production signed manifest has no payload.' }
          $payloadJson = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String([string]$envelope.payload))
          $manifest = $payloadJson | ConvertFrom-Json
          $gameplay = @($manifest.files | Where-Object { $_.role -eq 'gameplay-mod' })
          if ($gameplay.Count -ne 1) { throw "Expected exactly one gameplay-mod in production manifest, got $($gameplay.Count)." }

          $entry = $gameplay[0]
          if ([string]::IsNullOrWhiteSpace($entry.path) -or [string]::IsNullOrWhiteSpace($entry.downloadUrl) -or [string]::IsNullOrWhiteSpace($entry.sha256)) {
            throw 'Gameplay manifest entry is incomplete.'
          }
          $fileName = Split-Path -Leaf ([string]$entry.path)
          if (-not $fileName.EndsWith('.jar', [StringComparison]::OrdinalIgnoreCase)) { throw "Gameplay payload is not a JAR: $fileName" }
          $target = Join-Path 'launcher/Payload' $fileName
          Invoke-WebRequest -Uri ([string]$entry.downloadUrl) -OutFile $target

          $actualHash = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          $expectedHash = ([string]$entry.sha256).ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Gameplay mod SHA-256 mismatch: expected=$expectedHash actual=$actualHash" }
          if ($null -ne $entry.size -and [int64]$entry.size -gt 0) {
            $actualSize = (Get-Item $target).Length
            if ($actualSize -ne [int64]$entry.size) { throw "Gameplay mod size mismatch: expected=$($entry.size) actual=$actualSize" }
          }
          Write-Host "Using gameplay payload from production manifest: $fileName ($actualHash)"
      - name: Publish single-file EXE
        run: dotnet publish launcher/REvolutionClient.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o launcher/publish
      - name: Verify launcher payload
        shell: pwsh
        run: |
          if (-not (Test-Path 'launcher/publish/REvolutionClient.exe')) { throw 'REvolutionClient.exe is missing.' }
          $payload = Get-ChildItem launcher/Payload -Filter '*.jar'
          if ($payload.Count -lt 2) { throw 'Expected both gameplay and client mod payloads.' }
      - uses: actions/upload-artifact@v4
        with:
          name: REvolutionClient-win-x64
          path: launcher/publish/REvolutionClient.exe
          if-no-files-found: error
          retention-days: 3
