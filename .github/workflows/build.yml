name: Build RE:volution Client

on:
  push:
    branches: [ main, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main ]

jobs:
  auth-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Auth API
        run: dotnet build auth/REvolutionClient.Auth.csproj -c Release
      - name: Smoke test Auth API
        shell: bash
        run: |
          set -euo pipefail
          export REVOLUTION_AUTH_DB="$RUNNER_TEMP/revolution-auth-ci.db"
          dotnet run --project auth/REvolutionClient.Auth.csproj -c Release --no-build > "$RUNNER_TEMP/revolution-auth.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:25567/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat "$RUNNER_TEMP/revolution-auth.log"
            exit 1
          fi

          register_code=$(curl --silent --show-error -o "$RUNNER_TEMP/register.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"CiUser","password":"CiPassword123!"}' \
            http://127.0.0.1:25567/api/v1/auth/register)
          test "$register_code" = "200"

          login_code=$(curl --silent --show-error -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciuser","password":"CiPassword123!"}' \
            http://127.0.0.1:25567/api/v1/auth/login)
          test "$login_code" = "200"

          duplicate_code=$(curl --silent --show-error -o "$RUNNER_TEMP/duplicate.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"CIUSER","password":"AnotherPassword123!"}' \
            http://127.0.0.1:25567/api/v1/auth/register)
          test "$duplicate_code" = "409"

  manifest-signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build manifest signer
        run: dotnet build tools/ManifestSigner/ManifestSigner.csproj -c Release
      - name: Smoke test manifest signing
        shell: bash
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/manifest.private.pem"
          public_key="$RUNNER_TEMP/manifest.public.pem"
          envelope="$RUNNER_TEMP/manifest.signed.json"
          dotnet run --project tools/ManifestSigner/ManifestSigner.csproj -c Release --no-build -- generate \
            --private "$private_key" \
            --public "$public_key"
          dotnet run --project tools/ManifestSigner/ManifestSigner.csproj -c Release --no-build -- sign \
            --manifest manifest/bootstrap.dev.json \
            --private "$private_key" \
            --key-id ci-test-key \
            --output "$envelope"
          dotnet run --project tools/ManifestSigner/ManifestSigner.csproj -c Release --no-build -- verify \
            --envelope "$envelope" \
            --public "$public_key" \
            --key-id ci-test-key

  client-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build client-only Forge mod
        run: gradle -p mod -Dnet.minecraftforge.gradle.check.certs=false clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RE-volution-Client-Mod
          path: mod/build/libs/RE-volution-Client-Mod-*.jar
          if-no-files-found: error

  launcher:
    needs: [client-mod, manifest-signing]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download client mod payload
        uses: actions/download-artifact@v4
        with:
          name: RE-volution-Client-Mod
          path: launcher/Payload
      - name: Download and verify gameplay mod v1.3.2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path launcher/Payload | Out-Null
          $target = 'launcher/Payload/RE-volution-1.3.2.jar'
          Invoke-WebRequest -Uri 'https://github.com/Theyyk/re-volution-mod/releases/download/v1.3.2/RE-volution-1.3.2.jar' -OutFile $target
          $actual = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          $expected = '46624637e8d9c73947cef69ed9832a2f35f66abf81a647503254cd5a71a46d02'
          if ($actual -ne $expected) { throw "Gameplay mod SHA-256 mismatch: $actual" }
      - name: Build launcher
        run: dotnet build launcher/REvolutionClient.Launcher.csproj -c Release
      - name: Publish single-file EXE
        run: dotnet publish launcher/REvolutionClient.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o launcher/publish
      - name: Verify launcher payload
        shell: pwsh
        run: |
          if (-not (Test-Path 'launcher/publish/REvolutionClient.exe')) { throw 'REvolutionClient.exe is missing.' }
          $payload = Get-ChildItem launcher/Payload -Filter '*.jar'
          if ($payload.Count -lt 2) { throw 'Expected both gameplay and client mod payloads.' }
      - uses: actions/upload-artifact@v4
        with:
          name: REvolutionClient-win-x64
          path: launcher/publish/REvolutionClient.exe
          if-no-files-found: error
